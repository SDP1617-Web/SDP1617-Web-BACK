version: "3.8"

services:
  app:
    # 현재 디렉토리의 Dockerfile을 사용해서 Spring Boot 이미지 빌드
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdp-app
    restart: always
    env_file:
      - .env
    # MySQL 컨테이너가 먼저 생성된 후 app 실행
    depends_on:
      - db
    expose:
      - "8080"

  db:
    image: mysql:8.0
    container_name: sdp-mysql
    expose:
      - "3306"
    restart: always
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/mysql


  nginx:
    image: nginx:latest
    container_name: sdp-nginx
    restart: always

    # 외부 사용자는 80번 포트로 접속
    ports:
      - "80:80"

    # Nginx 설정 파일 연결
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    # app 컨테이너가 먼저 생성된 후 nginx 실행
    depends_on:
      - app

volumes:
  # MySQL 데이터가 컨테이너 삭제 후에도 유지되도록 named volume 사용
  db-data: