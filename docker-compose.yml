services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sdp-app
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_LOCATION: classpath:/application.yml,file:/app/config/application-prod.yml
    volumes:
      - ./config/application-prod.yml:/app/config/application-prod.yml:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  db:
    image: mysql:8.0
    container_name: sdp-mysql
    restart: always
    env_file:
      - .env
    volumes:
      - db-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s


  nginx:
    image: nginx:latest
    container_name: sdp-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  db-data: